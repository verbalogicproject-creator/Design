<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transport bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx" style="width: 100%; overflow: visible">
<div class="tp {{mode}}">
<div class="lcd tp-pos"><span class="lbl">Bar : beat</span><b>{{pos}}</b></div>
<button class="lcd tp-bpm" aria-label="Tempo {{bpm}} BPM. Tap to type a value."><span class="lbl">BPM</span><b>{{bpm}}</b></button>
<div class="tp-cpu">
<div class="cpu-t"><span class="lbl">CPU</span><span class="cpu-n {{cpuHot}}">{{cpu}}%</span></div>
<div class="cpu-m" role="img" aria-label="CPU load {{cpu}} percent">
<sc-for list="{{ segs }}" as="s" hint-placeholder-count="10"><i class="{{ s.cls }}"></i></sc-for>
</div>
<sc-if value="{{ hasLost }}" hint-placeholder-val="{{ false }}">
<button class="lost" aria-label="Audio dropped out {{lost}} times. Tap for details.">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f2a33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2 21h20z"></path><path d="M12 10v5M12 18v.5"></path></svg>
<span>Lost ×{{lost}}</span>
</button>
</sc-if>
</div>
<div class="tp-btns">
<button class="btn sq tg {{playCls}}" aria-label="Play" aria-pressed="{{playing}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1f2a33"><path d="M8 5v14l11-7z"></path></svg></button>
<button class="btn sq" aria-label="Stop"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1f2a33"><path d="M6 6h12v12H6z"></path></svg></button>
<button class="btn sq tg rec {{recCls}}" aria-label="Record" aria-pressed="{{rec}}"><svg width="22" height="22" viewBox="0 0 24 24"><circle class="rec-ico" cx="12" cy="12" r="7"></circle></svg></button>
<button class="btn sq tg {{loopCls}}" aria-label="Loop" aria-pressed="{{loop}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1f2a33"><path d="M17 2l4 4-4 4V7H7a2 2 0 0 0-2 2v2H3V9a4 4 0 0 1 4-4h10V2zM7 22l-4-4 4-4v3h10a2 2 0 0 0 2-2v-2h2v2a4 4 0 0 1-4 4H7v3z"></path></svg></button>
</div>
<button class="btn panic" aria-label="Panic: stop all sound">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffa594" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"></path><path d="M9 9l6 6M15 9l-6 6"></path></svg>
<span>Panic</span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":null,"default":"phone"},"pos":{"editor":null,"default":"012:3:04"},"bpm":{"editor":null,"default":"146.0"},"cpu":{"editor":null,"default":"38"},"lost":{"editor":null,"default":"0"},"playing":{"editor":null,"default":"1"},"rec":{"editor":null,"default":"0"},"loop":{"editor":null,"default":"1"},"$preview":{"width":412,"height":106}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const cpu = Math.max(0, Math.min(100, parseInt(p.cpu) || 0));
    const lit = Math.round(cpu / 10);
    const segs = [];
    for (let i = 0; i < 10; i++) segs.push({ cls: i < lit ? (i >= 8 ? 'hot' : 'on') : '' });
    const lost = parseInt(p.lost) || 0;
    return {
      mode: p.mode === 'wide' ? 'wide' : 'phone',
      pos: p.pos || '001:1:00',
      bpm: p.bpm || '146.0',
      cpu: cpu,
      cpuHot: cpu >= 85 ? 'hot' : '',
      segs: segs,
      lost: lost,
      hasLost: lost > 0,
      playing: p.playing === '1',
      rec: p.rec === '1',
      loop: p.loop !== '0',
      playCls: p.playing === '1' ? 'on' : '',
      recCls: p.rec === '1' ? 'on' : '',
      loopCls: p.loop !== '0' ? 'on' : ''
    };
  }
}
</script>
</body>
</html>
