<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Sing an idea</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr">
<b class="h3">Synth</b>
<span class="tape s">Rolling Bass 03</span>
<span class="f1"></span>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="005:2:01" bpm="146.0" cpu="41" lost="0" playing="0" rec="1" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c g8" style="padding: 8px">
<div class="r jb" style="min-height: 44px">
<div class="c"><span class="h3">Sing an idea</span><span class="sm dim">Hum or sing. It becomes notes on an instrument.</span></div>
<button class="btn ghost sq" aria-label="Close Sing an idea"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="r wrap g6">
<button class="chip t">Instrument · Pluck lead</button>
<button class="chip t">Key · F# minor</button>
<button class="btn tg on tiny" style="min-height: 44px" aria-pressed="true">Click</button>
<button class="btn tg tiny" style="min-height: 44px" aria-pressed="false">Count-in</button>
</div>
<div class="plate" style="padding: 10px">
<div class="r jb" style="margin-bottom: 8px">
<span class="r g8 b tal"><i class="pulse" style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--tally)"></i>RECORDING</span>
<div class="lcd" style="min-height: 36px; padding: 2px 10px"><b>0:07.3</b></div>
</div>
<div class="well mini-wave am" style="height: 64px" role="img" aria-label="Live level with detected pitch">
<sc-for list="{{ live }}" as="b" hint-placeholder-count="60"><i class="{{ b.cls }}" style="{{ b.st }}"></i></sc-for>
</div>
<div class="r jb" style="margin-top: 6px">
<span class="sm dim b">Input −14 dB</span>
<span class="sm b bl">Hearing: G#3 · in key</span>
</div>
<div class="r g8 jb" style="margin-top: 10px">
<button class="btn ghost big">Cancel</button>
<button class="btn big f1" aria-label="Stop recording"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1f2a33"><path d="M6 6h12v12H6z"></path></svg>Stop</button>
</div>
</div>
<dc-import name="TakeCard" label="Take 1" dur="0:12" kind="sing" playing="inst" conf="High" conf-pct="92%" note="Melody matches your voice closely." warn="Bar 3: pitch wobbles, snapped to the nearest note." seed="3" hint-size="396px,262px"></dc-import>
<div class="r g8 ast" style="padding: 2px 2px 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9zM12 15v-5M9.5 12L12 9.5 14.5 12"></path></svg>
<span class="sm f1">Everything above stays on this device. “Polish with AI” would send your voice to Google, so it asks first.</span>
<button class="cost" aria-label="Polish with AI, costs 4 cents"><span class="coin">$</span>Polish · <span class="price">$0.04</span></button>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" active="none" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const live = [];
    for (let i = 0; i < 60; i++) {
      const h = 14 + 70 * Math.abs(Math.sin(i * 0.31) * Math.cos(i * 0.11 + 0.6));
      live.push({ cls: i % 9 === 4 ? 'nn' : '', st: 'height:' + Math.round(Math.min(100, h)) + '%' });
    }
    return { live: live };
  }
}
</script>
</body>
</html>
