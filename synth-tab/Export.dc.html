<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Export</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx" style="width: 412px; height: 880px">
<dc-import name="Main" hint-size="412px,880px"></dc-import>
<div class="scrim"></div>
<div class="sheet c g8" role="dialog" aria-label="Export" style="top: 330px; overflow: hidden">
<div class="grab"></div>
<div class="r g8" style="min-height: 44px"><div class="c f1"><span class="h3">Export</span><span class="sm dim">Renders on this phone. Free.</span></div><button class="btn ghost sq" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="plate c g6" style="padding: 10px"><span class="lbl">What</span>
<div class="seg" style="width: 100%"><button class="btn f1 on" aria-pressed="true">Song</button><button class="btn f1">Loop</button><button class="btn f1">Stems</button></div>
<span class="sm dim">Bars 1–80 · 2:12 at 146 BPM · ends with a 2-bar tail</span></div>
<div class="plate c g6" style="padding: 10px"><span class="lbl">Format</span>
<div class="seg" style="width: 100%"><button class="btn f1 on" aria-pressed="true">WAV 24-bit</button><button class="btn f1">WAV 16</button><button class="btn f1">MP3</button></div></div>
<div class="plate c g6" style="padding: 10px">
<div class="r jb"><span class="tape">Rendering…</span><span class="sm b">1:04 of 2:12</span></div>
<div class="prog" role="progressbar" aria-valuenow="48" aria-valuemin="0" aria-valuemax="100" aria-label="Rendering song"><i style="width: 48%"></i></div>
<span class="sm dim">Faster than real time. You can keep editing; changes after now are not in this file.</span></div>
<div class="r g8"><button class="btn ghost big">Cancel</button><button class="btn big f1 disabled" aria-disabled="true">Share file</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
