<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lite · Drum Kit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr" style="gap: 4px; padding: 0 6px">
<button class="btn ghost sq" aria-label="Back to tracks">‹</button>
<span class="tape s">Drums</span>
<span class="f1"></span>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="009:2:03" bpm="146.0" cpu="58" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c" style="padding: 6px 8px; gap: 6px">
<div class="r jb" style="min-height: 40px">
<span class="tape l">Drum Kit</span>
<button class="chip t">Goa kit ▾</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button class="dpad c-red" aria-label="Snare pad"><i class="lamp"></i><span class="nm">Snare</span><span class="c g2"><span></span><span class="sub">sn_tape_02</span></span></button>
<button class="dpad c-red" aria-label="Clap pad"><i class="lamp"></i><span class="nm">Clap</span><span class="c g2"><span></span><span class="sub">clap_room</span></span></button>
<button class="dpad c-yellow hit" aria-label="Closed hat pad, Choke A"><i class="lamp"></i><span class="nm">Closed hat</span><span class="c g2"><span class="badge" style="background: var(--ink); color: var(--tape)">Choke A</span><span class="sub">ch_tight</span></span></button>
<button class="dpad c-yellow sel" aria-label="Open hat pad, Choke A"><i class="lamp"></i><span class="nm">Open hat</span><span class="c g2"><span class="badge" style="background: var(--ink); color: var(--tape)">Choke A</span><span class="sub">oh_tape_03</span></span></button>
<button class="dpad c-blue" aria-label="Crash pad"><i class="lamp"></i><span class="nm">Crash</span><span class="c g2"><span></span><span class="sub">crash_dark</span></span></button>
<button class="dpad c-blue" aria-label="Ride pad"><i class="lamp"></i><span class="nm">Ride</span><span class="c g2"><span></span><span class="sub">ride_ping</span></span></button>
<button class="dpad empty" aria-label="Empty pad 7. Tap to load a sample."><span class="nm">Pad 7</span><span class="sub">+ Load sample</span></button>
<button class="dpad empty" aria-label="Empty pad 8. Tap to load a sample."><span class="nm">Pad 8</span><span class="sub">+ Load sample</span></button>
</div>
<span class="sm dim">Tap a pad to hear it, hold to select without playing. Pads 7 and 8 are free for your own samples.</span>
<div class="plate c g6" style="padding: 8px 10px">
<div class="r g8"><span class="tape">Open hat</span><button class="chip f1" style="min-height: 44px; justify-content: space-between">oh_tape_03.wav <span>▾</span></button></div>
<div class="canvas-box" style="height: 44px"><svg width="100%" height="44" viewBox="0 0 360 44" preserveAspectRatio="none" aria-label="Open hat sample, 0.6 seconds"><path d="{{ waveD }}" fill="#f2b33d" fill-opacity="0.8"></path></svg></div>
<div class="r jb">
<dc-import name="Knob" label="Tune" size="sm" value="50" readout="0 st" hint-size="64px,86px"></dc-import>
<dc-import name="Knob" label="Decay" size="sm" value="62" readout="340 ms" hint-size="64px,86px"></dc-import>
<dc-import name="Knob" label="Level" size="sm" value="72" readout="−2 dB" hint-size="64px,86px"></dc-import>
<dc-import name="Knob" label="Pan" size="sm" value="60" readout="R20" hint-size="64px,86px"></dc-import>
</div>
<div class="r g8"><span class="lbl" style="width: 44px">Choke</span><div class="seg" role="group" aria-label="Choke group"><button class="btn" aria-pressed="false">Off</button><button class="btn on" aria-pressed="true">A</button><button class="btn" aria-pressed="false">B</button></div><span class="sm dim f1">Closed hat cuts this open hat.</span></div>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" profile="lite" active="drums" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    let d = 'M0 22', s = 7;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const top = [], bot = [];
    for (let i = 0; i <= 120; i++) { const x = i * 3, e = Math.exp(-i / 38) * (0.4 + 0.6 * r()); top.push(x + ' ' + (22 - e * 20).toFixed(1)); bot.push(x + ' ' + (22 + e * 20).toFixed(1)); }
    d = 'M' + top.join(' L') + ' L' + bot.reverse().join(' L') + ' Z';
    return { waveD: d };
  }
}
</script>
</body>
</html>
