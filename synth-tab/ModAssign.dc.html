<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Add modulation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx" style="width: 412px; height: 880px">
<dc-import name="PsyBass" hint-size="412px,880px"></dc-import>
<div class="scrim"></div>
<div class="sheet c g8" role="dialog" aria-label="Add modulation to Cutoff" style="top: 360px; overflow: hidden">
<div class="grab"></div>
<div class="r g8" style="min-height: 44px"><div class="c f1"><span class="h3">Modulate Cutoff</span><span class="sm dim">Step 2 of 2 · set how far it moves</span></div><button class="btn ghost sq" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="r g6 wrap"><button class="chip t" style="border-color: var(--amber)"><i class="mdi"></i>LFO 1 · 1/8</button><button class="chip t"><i class="mdi"></i>Env 2</button><button class="chip t"><i class="mdi"></i>Macro 1</button><button class="chip t">+ New LFO</button></div>
<div class="plate r g16" style="padding: 12px">
<dc-import name="Knob" label="Cutoff" size="lg" value="62" readout="1.2 kHz" mod-start="48" mod-len="22" hint-size="90px,120px"></dc-import>
<div class="c g6 f1"><span class="sm">Drag the green arc on the knob, or use the steppers. It moves from <b>800 Hz</b> to <b>2.9 kHz</b>.</span>
<div class="r g6"><span class="lbl" style="width: 52px">Amount</span><div class="step-b"><button class="btn ghost sq" aria-label="Less">−</button><span class="v gr">+32 %</span><button class="btn ghost sq" aria-label="More">+</button></div></div>
<div class="r g6"><span class="lbl" style="width: 52px">Shape</span><div class="seg" style="padding: 0; background: none"><button class="btn on">Both</button><button class="btn">Up</button><button class="btn">Down</button></div></div></div>
</div>
<div class="r g8"><button class="btn ghost f1">Back</button><button class="btn f1">Done</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
