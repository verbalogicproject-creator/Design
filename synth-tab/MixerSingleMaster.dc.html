<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Mixer, master</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr">
<b class="h3">Synth</b>
<span class="tape s">Rolling Bass 03</span>
<span class="f1"></span>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="005:2:01" bpm="146.0" cpu="38" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c g8" style="padding: 6px 8px">
<div class="seg" style="width: 100%" role="group" aria-label="Strip type"><button class="btn f1" aria-pressed="false">Channels</button><button class="btn f1" aria-pressed="false">Buses</button><button class="btn f1 on" aria-pressed="true">Master</button></div>
<div class="r g8" style="height: 48px">
<button class="btn ghost sq disabled" aria-label="No previous strip" aria-disabled="true">‹</button>
<div class="f1 r jc g8"><i class="chcap cap-white" style="height: 30px"></i><div class="c" style="align-items: center"><span class="tape">Master</span><span class="sm dim b">the only master · always last</span></div></div>
<button class="btn ghost sq disabled" aria-label="No next strip" aria-disabled="true">›</button>
</div>
<div class="r g8 ast">
<div class="plate c" style="width: 124px; flex: none; padding: 10px 6px 8px; align-items: center">
<dc-import name="Fader" h="424" value="80" color="white" l="74" r="71" pk-l="86" pk-r="84" scale="1" hint-size="110px,490px"></dc-import>
</div>
<div class="c g8 f1" style="min-width: 0">
<div class="plate c g6" style="padding: 8px">
<div class="r jb"><span class="tape s">Loudness</span><span class="sm dim b">last 3 s</span></div>
<div class="r g8"><div class="lcd f1"><span class="lbl">Short-term</span><b>−8.4 LUFS</b></div><div class="lcd f1"><span class="lbl">True peak</span><b>−0.9 dB</b></div></div>
</div>
<div class="plate c g6" style="padding: 8px">
<div class="r jb"><span class="tape s">Inserts</span><span class="sm dim b">3 of 8</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="8"><button class="slot-b {{ s.cls }}" aria-label="{{ s.label }}"><span class="n">{{ s.n }}</span><span class="t">{{ s.t }}</span></button></sc-for>
</div>
<div class="r g6 sm b" style="min-height: 22px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 12l6 6 6-6"></path></svg><span class="f1">Limiter −1.2 dB</span><div class="gr-m" style="max-width: 44px" aria-label="Gain reduction 1.2 decibels"><i style="width: 10%"></i></div></div>
</div>
<div class="plate r jb" style="padding: 8px">
<dc-import name="Knob" label="Ceiling" size="sm" value="92" readout="−1.0 dB" hint-size="72px,86px"></dc-import>
<dc-import name="Knob" label="Output" size="sm" value="80" readout="0 dB" hint-size="72px,86px"></dc-import>
<span class="chip" aria-label="Output to speakers">→ Phone</span>
</div>
</div>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" active="mixer" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (n, t, cls, label) => ({ n: String(n), t: t, cls: cls || '', label: label || (n + ' ' + t) });
    return {
      slots: [
        s(1, 'EQ', ''), s(2, 'Glue comp', ''), s(3, 'Limiter', ''), s(4, '+ Add', 'emp', '4 empty slot'),
        s(5, '+ Add', 'emp', '5 empty slot'), s(6, '+ Add', 'emp', '6 empty slot'), s(7, '+ Add', 'emp', '7 empty slot'), s(8, '+ Add', 'emp', '8 empty slot')
      ]
    };
  }
}
</script>
</body>
</html>
