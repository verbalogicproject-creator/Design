<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landscape · Playlist</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx" style="width: 892px; height: 412px; display: flex; flex-direction: column">
<div style="flex: none; height: 56px"><dc-import name="Transport" mode="wide" pos="005:2:01" bpm="146.0" cpu="38" lost="0" playing="1" rec="0" loop="1" hint-size="892px,56px"></dc-import></div>
<div class="r astr" style="flex: 1 1 0; min-height: 0">
<div style="flex: none; width: 60px; height: 356px"><dc-import name="Nav" mode="rail" active="playlist" hint-size="60px,356px"></dc-import></div>
<div class="f1 c" style="min-width: 0">
<div class="r jb g6" style="height: 44px; padding: 0 6px">
<div class="r g6">
<div class="seg" style="padding: 0 4px; background: none" role="group" aria-label="Playlist tool">
<button class="btn sq on" aria-label="Select" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1f2a33"><path d="M5 3l14 8-6 2-3 6z"></path></svg></button>
<button class="btn sq" aria-label="Draw"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2a33" stroke-width="2.4" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"></path></svg></button>
<button class="btn sq" aria-label="Slice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2a33" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M6 8l6-5 6 5"></path></svg></button>
<button class="btn sq" aria-label="Mute block"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2a33" stroke-width="2.4" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"></path></svg></button>
</div>
<button class="btn ghost">Snap ¼ bar</button>
<button class="btn ghost sq" aria-label="Zoom out">−</button>
<button class="btn ghost sq" aria-label="Zoom in">+</button>
<button class="btn ghost">Patterns</button>
</div>
<span class="rev un"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6"><circle cx="12" cy="12" r="6"></circle></svg>unsaved · r12</span>
</div>
<div class="rel">
<div class="r" style="height: 28px; background: var(--slate-lift); border-bottom: 1px solid var(--seam)">
<div style="width: 96px; flex: none" class="lbl pad8">Bar</div>
<div class="ruler f1" style="border-bottom: 0"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="8"><b style="{{ b.st }}">{{ b.n }}</b></sc-for><i class="loopbar" style="left: 368px; width: 368px"></i></div>
</div>
<sc-for list="{{ tracks }}" as="t" hint-placeholder-count="5">
<div class="trk" style="height: 54px">
<div class="trk-h" style="width: 96px; gap: 4px">
<i class="stripe cap-{{ t.color }}"></i>
<div class="c f1"><span class="lbl" style="color: var(--text)">{{ t.name }}</span><span class="sm dim">{{ t.sub }}</span></div>
<button class="btn sq tg tiny {{ t.mCls }}" style="min-width: 44px; min-height: 44px" aria-label="Mute {{ t.name }}">M</button>
</div>
<div class="lane" style="background-image: repeating-linear-gradient(90deg,#232c33 0 1px,transparent 1px 92px)">
<sc-for list="{{ t.blocks }}" as="b" hint-placeholder-count="2">
<div style="{{ b.pos }}"><dc-import name="PatternBlock" kind="{{ b.kind }}" label="{{ b.name }}" color="{{ t.color }}" w="{{ b.w }}" h="44" seed="{{ b.seed }}" sel="{{ b.sel }}" hint-size="184px,44px"></dc-import></div>
</sc-for>
</div>
</div>
</sc-for>
<div class="playhead" style="left: 579px"></div>
<div class="scroll-h" style="position: relative; height: 8px"><i style="left: 40%; width: 30%"></i></div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":892,"height":412}}'>
class Component extends DCLogic {
  renderVals() {
    const BW = 92;
    const bars = [1, 2, 3, 4, 5, 6, 7, 8].map((n, i) => ({ n: String(n), st: 'left:' + (i * BW) + 'px' }));
    const mk = (b, len, name, kind, seed, sel) => ({ pos: 'position:absolute;left:' + (b * BW) + 'px;top:5px', w: String(len * BW - 2), name: name, kind: kind, seed: String(seed), sel: sel ? '1' : '0' });
    const tracks = [
      { name: 'Kick', sub: 'MIDI', color: 'red', blocks: [mk(0, 2, 'Kick A', 'midi', 1), mk(2, 2, 'Kick A', 'midi', 1), mk(4, 2, 'Kick A', 'midi', 1), mk(6, 2, 'Kick B', 'midi', 3)] },
      { name: 'Bass', sub: 'MIDI', color: 'yellow', blocks: [mk(1, 3, 'Bass roll', 'midi', 2), mk(4, 4, 'Bass roll', 'midi', 2, true)] },
      { name: 'Hats', sub: 'MIDI', color: 'white', blocks: [mk(2, 6, 'Hats off', 'midi', 6)] },
      { name: 'Vox', sub: 'Audio', color: 'blue', blocks: [mk(3.5, 2.5, 'Vox idea', 'audio', 3)] },
      { name: 'Pad', sub: 'AI audio', color: 'green', blocks: [mk(0, 4, 'Lyria · forest', 'audio', 5), mk(4, 4, 'Lyria · forest', 'audio', 8)] }
    ];
    tracks[1].mCls = '';
    tracks[2].mCls = 'on';
    return { bars: bars, tracks: tracks.map((t) => Object.assign({ mCls: '' }, t)) };
  }
}
</script>
</body>
</html>
