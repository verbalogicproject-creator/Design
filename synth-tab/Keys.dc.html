<head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">

<div class="sx" style="width: 412px; height: 880px">

<div class="scrim"></div>

<div class="r g8">
<div class="seg" role="group" aria-label="Surface"><button class="btn on" aria-pressed="true">Keys</button><button class="btn" aria-pressed="false">Pads</button></div>
<div class="step-b"><button class="btn ghost sq" aria-label="Octave down">−</button><span class="v">Oct 2</span><button class="btn ghost sq" aria-label="Octave up">+</button></div>
<button class="btn tg on" aria-pressed="true">Scale</button>

150px; background: var(--alu); border: 0; border-right: 1px solid var(--seam); border-radius: 0 0 5px 5px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-weight: 700; color: var(--ink); font-family: inherit" aria-label="E"></button><button class="f1" style="height: 150px; background: var(--alu); border: 0; border-right: 1px solid var(--seam); border-radius: 0 0 5px 5px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-weight: 700; color: var(--ink); font-family: inherit" aria-label="F#">F#</button></div>

<div class="r g8">
<button class="btn tg rec" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24"><circle class="rec-ico" cx="12" cy="12" r="7"></circle></svg>Record into Bass roll</button>
<button class="chip t f1">No MIDI keyboard · Connect</button>
</div>
</div>
</div>
