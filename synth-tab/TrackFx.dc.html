<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lite · Track FX</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx" style="width: 412px; height: 880px">
<dc-import name="LiteRack" hint-size="412px,880px"></dc-import>
<div class="scrim"></div>
<div class="sheet c g8" role="dialog" aria-label="Track FX, Rolling Bass" style="top: 96px; overflow: hidden">
<div class="grab"></div>
<div class="r g8" style="min-height: 44px">
<i class="chcap cap-yellow" style="height: 30px"></i>
<div class="c f1"><span class="h3">Track FX</span><span class="sm dim">Rolling Bass · Psy Bass · same on every Lite track</span></div><button class="btn ghost sq" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="plate c g4" style="padding: 8px 10px">
<div class="r jb"><span class="tape s">EQ</span><span class="sm dim">3 band · drag a dot or turn a knob</span></div>
<div class="rel" style="height: 208px">
<div class="abs" style="left: 0; top: 0; opacity: .9"><dc-import name="EqCurve" bands="3" low="2" mid="-1.5" high="-3" w="366" h="112" hint-size="366px,112px"></dc-import></div>
<div class="abs r jb" style="left: 0; right: 0; bottom: 0">
<dc-import name="Knob" label="Low" size="md" value="58" readout="+2 dB" hint-size="72px,100px"></dc-import>
<dc-import name="Knob" label="Mid" size="md" value="44" readout="−1.5 dB" hint-size="72px,100px"></dc-import>
<dc-import name="Knob" label="High" size="md" value="40" readout="−3 dB" hint-size="72px,100px"></dc-import>
</div>
</div>
</div>
<div class="plate c g4" style="padding: 8px 10px">
<div class="r jb"><span class="tape s">Sends</span><span class="sm dim">to the song’s shared Reverb and Delay</span></div>
<div class="r" style="justify-content: space-around">
<dc-import name="Knob" label="Reverb" size="md" value="18" readout="−18 dB" hint-size="72px,100px"></dc-import>
<dc-import name="Knob" label="Delay" size="md" value="0" readout="off" hint-size="72px,100px"></dc-import>
</div>
</div>
<div class="plate c g6" style="padding: 8px 10px">
<div class="r g8"><span class="tape s">Duck</span><span class="f1"></span><button class="btn tg on" aria-pressed="true">Duck on</button></div>
<div class="r g8 sm b"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v14M6 12l6 6 6-6"></path></svg><span class="f1">Ducked by Kick −3 dB</span><div class="gr-m" style="max-width: 80px" aria-label="Gain reduction 3 decibels"><i style="width: 25%"></i></div></div>
<div class="r g8"><span class="lbl" style="width: 60px">Amount</span><div class="step-b"><button class="btn ghost sq" aria-label="Less ducking">−</button><span class="v">6 dB</span><button class="btn ghost sq" aria-label="More ducking">+</button></div><span class="sm dim f1">the most the kick can pull it down</span></div>
</div>
<div class="r g8 sm" style="min-height: 32px"><span class="f1">Full mixer with insert slots and groups</span><span class="onpc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>On PC</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
