<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Mixer, one strip</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr">
<b class="h3">Synth</b>
<span class="tape s">Rolling Bass 03</span>
<span class="f1"></span>
<button class="btn ghost sq" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="btn ghost sq" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h3"></path></svg></button>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="005:2:01" bpm="146.0" cpu="38" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c g8" style="padding: 6px 8px">
<div class="seg" style="width: 100%" role="group" aria-label="Strip type"><button class="btn f1 on" aria-pressed="true">Channels</button><button class="btn f1" aria-pressed="false">Buses</button><button class="btn f1" aria-pressed="false">Master</button></div>
<div class="r g8" style="height: 48px">
<button class="btn ghost sq" aria-label="Previous strip">‹</button>
<div class="f1 r jc g8"><i class="chcap cap-yellow" style="height: 30px"></i><div class="c" style="align-items: center"><span class="tape">Bass</span><span class="sm dim b">channel 2 of 8 · swipe or tap ‹ ›</span></div></div>
<button class="btn ghost sq" aria-label="Next strip">›</button>
</div>
<div class="r g8 ast">
<div class="plate c" style="width: 124px; flex: none; padding: 10px 6px 8px; align-items: center">
<dc-import name="Fader" h="424" value="78" color="yellow" l="58" r="55" pk-l="70" pk-r="68" scale="1" hint-size="110px,490px"></dc-import>
</div>
<div class="c g8 f1" style="min-width: 0">
<div class="plate r jb" style="padding: 8px">
<dc-import name="Knob" label="Pan" size="sm" value="46" readout="L8" hint-size="64px,86px"></dc-import>
<span class="chip" aria-label="Output to Drums bus">→ Drums</span>
<div class="c g6">
<button class="btn sq tg m" aria-label="Mute Bass" style="width: 56px">M</button>
<button class="btn sq tg s" aria-label="Solo Bass" style="width: 56px">S</button>
</div>
</div>
<div class="plate c g6" style="padding: 8px">
<div class="r jb"><span class="tape s">Inserts</span><span class="sm dim b">4 of 8</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="8"><button class="slot-b {{ s.cls }}" aria-label="{{ s.label }}"><span class="n">{{ s.n }}</span><span class="t">{{ s.t }}</span></button></sc-for>
</div>
<div class="r g6 sm b" style="min-height: 22px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 12l6 6 6-6"></path></svg><span class="f1">Ducked by Kick −3 dB</span><div class="gr-m" style="max-width: 44px" aria-label="Gain reduction 3 decibels"><i style="width: 25%"></i></div></div>
</div>
<div class="plate c g4" style="padding: 8px">
<div class="r jb"><span class="tape s">Sends</span><button class="btn tg tiny" style="min-height: 44px" aria-pressed="false">Post</button></div>
<div class="r jb">
<dc-import name="Knob" label="To Verb" size="sm" value="24" readout="−12 dB" hint-size="72px,86px"></dc-import>
<dc-import name="Knob" label="To Delay" size="sm" value="0" readout="off" hint-size="72px,86px"></dc-import>
</div>
</div>
</div>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" active="mixer" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (n, t, cls, label) => ({ n: String(n), t: t, cls: cls || '', label: label || (n + ' ' + t) });
    return {
      slots: [
        s(1, 'EQ', ''), s(2, 'Saturator', ''), s(3, 'Comp ← Kick', '', '3 Compressor, sidechain key Kick'), s(4, 'Limiter · off', 'byp', '4 Limiter, bypassed'),
        s(5, '+ Add', 'emp', '5 empty slot'), s(6, '+ Add', 'emp', '6 empty slot'), s(7, '+ Add', 'emp', '7 empty slot'), s(8, '+ Add', 'emp', '8 empty slot')
      ]
    };
  }
}
</script>
</body>
</html>
