<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Piano roll</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr">
<b class="h3">Synth</b>
<span class="tape s">Rolling Bass 03</span>
<span class="f1"></span>
<button class="btn ghost sq" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="btn ghost sq" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h3"></path></svg></button>
<span class="rev un"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6"><circle cx="12" cy="12" r="6"></circle></svg>unsaved · r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="005:2:01" bpm="146.0" cpu="38" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body">
<div class="r jb g6" style="padding: 0 6px; height: 52px">
<div class="seg" role="group" aria-label="Roll tool">
<button class="btn on" aria-pressed="true">Draw</button>
<button class="btn" aria-pressed="false">Select</button>
<button class="btn" aria-pressed="false">Erase</button>
</div>
<button class="btn ghost" aria-label="Snap one sixteenth">Snap 1/16</button>
<button class="btn tg on" aria-pressed="true" aria-label="Fold to scale">Fold</button>
</div>
<div class="r" style="padding: 0 6px 0 6px">
<div class="c" style="width: 48px; flex: none">
<div class="lbl" style="height: 24px; line-height: 24px">Fmin</div>
<div class="rel" style="height: 352px">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="8"><div class="key w" style="{{ k.st }}">{{ k.n }}<b style="margin-left: 3px">{{ k.root }}</b></div></sc-for>
</div>
</div>
<div class="f1 c" style="min-width: 0; position: relative">
<div class="rel" style="height: 24px; background: var(--slate-lift); border-bottom: 1px solid var(--seam); overflow: hidden">
<b class="sm dim" style="position: absolute; left: 4px; top: 5px">Bar 5</b>
<b class="sm dim" style="position: absolute; left: 180px; top: 5px">·2</b>
</div>
<div class="roll" style="height: 352px; background-image: repeating-linear-gradient(90deg,#232c33 0 1px,transparent 1px 44px), repeating-linear-gradient(90deg,#4a5a66 0 2px,transparent 2px 176px)">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8"><div class="rrow {{ r.cls }}" style="{{ r.st }}"></div></sc-for>
<sc-for list="{{ notes }}" as="n" hint-placeholder-count="8">
<div class="rnote {{ n.cls }}" style="{{ n.st }}"><i class="l"></i><i class="r"></i></div>
</sc-for>
<div class="playhead" style="left: 198px"></div>
</div>
</div>
</div>
<div class="r" style="padding: 6px 6px 0">
<div class="lbl" style="width: 48px; flex: none">Vel</div>
<div class="canvas-box f1" style="height: 84px">
<sc-for list="{{ vels }}" as="v" hint-placeholder-count="8"><i class="abs" style="{{ v.st }}"></i></sc-for>
</div>
</div>
<div class="c g4" style="padding: 8px 6px 0">
<div class="r jb"><span class="b">A2 · step 6 · ⅛ · vel 96</span><span class="sm dim">or drag the note</span></div>
<div class="r jb">
<div class="c g2"><span class="lbl">Pitch</span><div class="step-b"><button class="btn ghost sq" aria-label="Pitch down">−</button><span class="v">A2</span><button class="btn ghost sq" aria-label="Pitch up">+</button></div></div>
<div class="c g2"><span class="lbl">Length</span><div class="step-b"><button class="btn ghost sq" aria-label="Shorter">−</button><span class="v">⅛</span><button class="btn ghost sq" aria-label="Longer">+</button></div></div>
<div class="c g2"><span class="lbl">Velocity</span><div class="step-b"><button class="btn ghost sq" aria-label="Softer">−</button><span class="v">96</span><button class="btn ghost sq" aria-label="Louder">+</button></div></div>
</div>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" active="roll" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['F#3', 'E3', 'D3', 'C#3', 'B2', 'A2', 'G#2', 'F#2'];
    const keys = names.map((n, i) => ({ n: n, root: n.charAt(0) === 'F' ? '●' : '', st: 'top:' + (i * 44) + 'px;height:44px' }));
    const rows = names.map((n, i) => ({ st: 'top:' + (i * 44) + 'px;height:44px', cls: (i % 2 ? 'black' : '') }));
    const src = [
      { s: 1, l: 1, r: 7, v: 88 }, { s: 2, l: 1, r: 7, v: 80 }, { s: 3, l: 1, r: 7, v: 96 },
      { s: 3, l: 1, r: 0, v: 100 }, { s: 5, l: 1, r: 7, v: 84 }, { s: 6, l: 2, r: 5, v: 96, sel: true }
    ];
    const notes = src.map((q) => ({
      cls: q.sel ? 'sel' : '',
      st: 'left:' + (q.s * 44 + 2) + 'px;top:' + (q.r * 44 + 3) + 'px;width:' + (q.l * 44 - 4) + 'px;height:38px' + (q.r === 0 ? ';background:var(--yellow)' : '')
    }));
    const vels = src.map((q) => ({
      st: 'left:' + (q.s * 44 + 14) + 'px;bottom:0;width:14px;height:' + Math.round(q.v * 0.72) + 'px;background:' + (q.sel ? 'var(--amber)' : 'var(--alu-dim)') + (q.sel ? ';box-shadow:0 0 0 2px var(--ink)' : '')
    }));
    return { keys: keys, rows: rows, notes: notes, vels: vels };
  }
}
</script>
</body>
</html>
