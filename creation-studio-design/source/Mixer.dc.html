<div class="sx ph" style="width: 412px; height: 880px">

<span class="tape s">Rolling Bass 03</span>
<span class="f1"></span>
<button class="btn ghost sq" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="btn ghost sq" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h3"></path></svg></button>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>

<div style="flex: none; height: 106px">

</div>
<div class="ph-body">
<div class="r jb" style="padding: 4px 8px; height: 56px">
<div class="seg" role="group" aria-label="Mixer bank">
<button class="btn on" aria-pressed="true">1–4</button>
<button class="btn" aria-pressed="false">5–8</button>
<button class="btn" aria-pressed="false">FX</button>
<button class="btn" aria-pressed="false">Bus</button>
</div>
<span class="sm dim" style="text-align: right">Peak hold 2 s<br>Tap a value to type dB</span>
</div>
<div class="r ast" style="padding: 0 7px; gap: 4px">
<dc-import name="Strip" label="Kick" num="1" color="red" vol="82" pan="0" l="96" r="92" pk="100" clip="1" fx="2" fh="250" hint-size="72px,590px"></dc-import>
<dc-import name="Strip" label="Bass" num="2" color="yellow" vol="78" pan="-8" l="58" r="55" pk="70" fx="3" sel="1" fh="250" hint-size="72px,590px"></dc-import>
<dc-import name="Strip" label="Hats" num="3" color="white" vol="64" pan="22" l="34" r="38" pk="52" solo="1" fx="1" fh="250" hint-size="72px,590px"></dc-import>
<dc-import name="Strip" label="Clap" num="4" color="blue" vol="70" pan="-14" l="46" r="44" pk="60" mute="1" fx="0" fh="250" hint-size="72px,590px"></dc-import>
<div style="width: 4px"></div>
<dc-import name="Strip" label="Master" num="M" color="white" vol="80" pan="0" l="74" r="71" pk="86" fx="0" fh="250" w="90" no-ms="1" show-fx="0" hint-size="90px,500px"></dc-import>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" active="mixer" hint-size="412px,60px"></dc-import>
</div>
</div>
