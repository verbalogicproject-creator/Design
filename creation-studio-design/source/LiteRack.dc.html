<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lite · Tracks</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr" style="gap: 4px; padding: 0 6px">
<button class="prof" aria-label="Lite profile. Tap to see what Lite includes."><b>LITE</b></button>
<span class="tape s">Forest Roll 07</span>
<span class="f1"></span>
<button class="btn ghost sq" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="btn ghost sq" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h3"></path></svg></button>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="009:2:03" bpm="146.0" cpu="58" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c g8" style="padding: 8px">
<div class="r jb" style="height: 44px">
<span class="h2">Tracks · 7</span>
<button class="btn" aria-label="Add a track"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f2a33" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add track</button>
</div>
<button class="plate r g8" style="padding: 6px 10px; min-height: 44px; width: 100%; border: 1px solid var(--seam); color: var(--text); text-align: left; cursor: pointer; font-family: inherit" aria-label="Phone budget: CPU 58 percent, Lite Synth 1 of 2, 1 track frozen. Tap for details.">
<span class="lbl" style="width: 50px">Budget</span>
<div class="hmeter" style="max-width: 110px"><i style="width: 58%"></i><u></u></div>
<span class="sm b f1">58 % · Lite Synth 1 of 2 · 1 frozen</span>
<span class="sm dim">›</span>
</button>
<div class="c" style="margin: 0 -8px">
<sc-for list="{{ rows }}" as="ch" hint-placeholder-count="6">
<div class="rk {{ ch.rowCls }}" style="height: 92px">
<div class="r g8" style="height: 48px">
<i class="chcap {{ ch.capCls }}" style="height: 38px"></i>
<span class="chnum">{{ ch.num }}</span>
<span class="tape" style="max-width: 120px; overflow: hidden; text-overflow: ellipsis">{{ ch.name }}</span>
<span class="sm dim b f1" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ ch.inst }}</span>
<button class="btn sq tg m {{ ch.mCls }}" aria-label="Mute {{ ch.name }}" aria-pressed="{{ ch.mute }}">M</button>
<button class="btn sq tg s" aria-label="Solo {{ ch.name }}" aria-pressed="false">S</button>
</div>
<div class="r g8" style="height: 44px; padding-left: 24px">
<div class="hf"><input type="range" class="ovl" min="0" max="100" value="{{ ch.vol }}" aria-label="Volume {{ ch.name }}" aria-valuetext="{{ ch.db }}"><i class="slot"></i><i class="hfcap {{ ch.capCls }}" style="{{ ch.capSt }}"></i></div>
<button class="db-btn" aria-label="Volume {{ ch.name }} {{ ch.db }}. Tap to type a value.">{{ ch.db }}</button>
<div class="r f1" style="min-width: 0; justify-content: flex-end">
<sc-if value="{{ ch.steps }}" hint-placeholder-val="{{ true }}"><dc-import name="StepRow" pat="{{ ch.pat }}" cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></sc-if>
<sc-if value="{{ ch.audio }}" hint-placeholder-val="{{ false }}"><span class="chip" style="min-height: 26px">{{ ch.audioTxt }}</span></sc-if>
<sc-if value="{{ ch.frozen }}" hint-placeholder-val="{{ false }}"><span class="r g6"><span class="frz-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"></path></svg>Frozen</span><span class="onpc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>On PC</span></span></sc-if>
</div>
</div>
</div>
</sc-for>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" profile="lite" active="rack" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { num: '1', name: 'Kick', inst: 'Kick', color: 'red', pat: 'a...x...x...x...', vol: 82, db: '−1.5 dB' },
      { num: '2', name: 'Drums', inst: 'Drum Kit · 6 pads', color: 'white', pat: '..x.x.x...x.x.xo', vol: 70, db: '−5.0 dB' },
      { num: '3', name: 'Rolling Bass', inst: 'Psy Bass', color: 'yellow', pat: '.xoo.xoo.xoo.xoa', vol: 78, db: '−3.0 dB', sel: true },
      { num: '4', name: 'Lead', inst: 'Lite Synth', color: 'green', pat: 'x.o.x..ox.o.x...', vol: 60, db: '−9.0 dB' },
      { num: '5', name: 'Stab', inst: 'Poly Synth · from Full', color: 'blue', vol: 64, db: '−7.5 dB', frozen: true },
      { num: '6', name: 'Lyria intro', inst: 'AI audio', color: 'green', vol: 52, db: '−11 dB', audio: 'audio · 32 s' }
    ];
    return { rows: rows.map((r) => ({
      num: r.num, name: r.name, inst: r.inst, capCls: 'cap-' + r.color, vol: String(r.vol), db: r.db,
      capSt: 'left:' + Math.round(11 + 90 * r.vol / 100) + 'px',
      rowCls: (r.sel ? 'sel' : '') + (r.frozen ? ' frz' : ''), mCls: '', mute: false,
      pat: r.pat || '', steps: !r.frozen && !r.audio, audio: !!r.audio, audioTxt: r.audio || '', frozen: !!r.frozen
    })) };
  }
}
</script>
</body>
</html>
