<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lite · Shared effects and master</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr" style="gap: 4px; padding: 0 6px">
<button class="prof" aria-label="Lite profile. Tap to see what Lite includes."><b>LITE</b></button>
<span class="tape s">Forest Roll 07</span>
<span class="f1"></span>
<button class="btn ghost sq" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="btn ghost sq" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h3"></path></svg></button>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="009:2:03" bpm="146.0" cpu="58" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c" style="padding: 6px 8px; gap: 6px">
<div class="seg" style="width: 100%" role="group" aria-label="Strip type"><button class="btn f1" aria-pressed="false">Tracks</button><button class="btn f1 on" aria-pressed="true">Reverb · Delay</button><button class="btn f1" aria-pressed="false">Master</button></div>
<div class="plate c g4" style="padding: 8px">
<div class="r jb"><span class="tape">Reverb</span><span class="sm dim b">one, shared · 4 tracks send</span></div>
<div class="r jb"><dc-import name="Knob" label="Size" value="64" readout="hall" hint-size="72px,100px"></dc-import><dc-import name="Knob" label="Decay" value="52" readout="2.4 s" hint-size="72px,100px"></dc-import><dc-import name="Knob" label="Tone" value="38" readout="dark" hint-size="72px,100px"></dc-import><dc-import name="Knob" label="Return" value="70" readout="−4 dB" hint-size="72px,100px"></dc-import></div>
</div>
<div class="plate c g6" style="padding: 8px">
<div class="r jb"><span class="tape">Delay</span><span class="sm dim b">synced to 146 BPM</span></div>
<div class="seg" style="width: 100%" role="group" aria-label="Delay time"><button class="btn f1" aria-pressed="false">1/16</button><button class="btn f1" aria-pressed="false">1/8</button><button class="btn f1 on" aria-pressed="true">1/8 dot</button><button class="btn f1" aria-pressed="false">1/4</button></div>
<div class="r jb"><dc-import name="Knob" label="Feedback" value="45" readout="45 %" hint-size="72px,100px"></dc-import><dc-import name="Knob" label="Tone" value="55" readout="4 kHz" hint-size="72px,100px"></dc-import><dc-import name="Knob" label="Width" value="80" readout="wide" hint-size="72px,100px"></dc-import><dc-import name="Knob" label="Return" value="60" readout="−7 dB" hint-size="72px,100px"></dc-import></div>
</div>
<div class="plate c g6" style="padding: 8px">
<div class="r jb"><span class="tape">Master limiter</span><span class="sm dim b">always on</span></div>
<div class="r g8"><div class="lcd f1"><span class="lbl">Short-term</span><b>−8.9 LUFS</b></div><div class="lcd f1"><span class="lbl">True peak</span><b>−1.0 dB</b></div></div>
<div class="r g8"><dc-import name="Knob" label="Ceiling" size="sm" value="92" readout="−1.0 dB" hint-size="64px,86px"></dc-import><div class="c g4 f1"><div class="r g6 sm b"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 12l6 6 6-6"></path></svg><span class="f1">Limiting −1.4 dB</span></div><div class="gr-m"><i style="width: 12%"></i></div></div></div>
</div>
<span class="sm dim">Lite has one reverb and one delay for the whole song, so the phone only runs each once.</span>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" profile="lite" active="mixer" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
