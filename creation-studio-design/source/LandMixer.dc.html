<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landscape · Mixer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx" style="width: 892px; height: 412px; display: flex; flex-direction: column">
<div style="flex: none; height: 56px"><dc-import name="Transport" mode="wide" pos="005:2:01" bpm="146.0" cpu="38" lost="0" playing="1" rec="0" loop="1" hint-size="892px,56px"></dc-import></div>
<div class="r astr" style="flex: 1 1 0; min-height: 0">
<div style="flex: none; width: 60px; height: 356px"><dc-import name="Nav" mode="rail" active="mixer" hint-size="60px,356px"></dc-import></div>
<div class="f1 r ast" style="min-width: 0; padding: 4px 4px 0; gap: 4px">
<div class="c g6" style="width: 52px; flex: none"><span class="lbl" style="text-align: center">Bank</span>
<div class="seg" style="flex-direction: column; padding: 3px" role="group" aria-label="Mixer bank"><button class="btn on" style="padding: 8px 0 0; min-width: 44px" aria-pressed="true">1–4</button><button class="btn" style="padding: 8px 0 0; min-width: 44px" aria-pressed="false">5–8</button><button class="btn" style="padding: 8px 0 0; min-width: 44px" aria-pressed="false">Buses</button></div>
<span class="sm dim" style="text-align: center; font-size: 11px">Master stays</span></div>
<dc-import name="Strip" label="Kick" num="1" color="red" vol="82" l="96" r="92" pk="100" clip="1" badge="→ Drums" no-pan="1" fh="150" w="92" layout="row" show-fx="0" hint-size="92px,330px"></dc-import>
<dc-import name="Strip" label="Bass" num="2" color="yellow" vol="78" l="58" r="55" pk="70" sel="1" badge="duck −3 dB" badge-cls="am" no-pan="1" fh="150" w="92" layout="row" show-fx="0" hint-size="92px,330px"></dc-import>
<dc-import name="Strip" label="Hats" num="3" color="white" vol="64" l="34" r="38" pk="52" solo="1" badge="→ Drums" no-pan="1" fh="150" w="92" layout="row" show-fx="0" hint-size="92px,330px"></dc-import>
<dc-import name="Strip" label="Clap" num="4" color="blue" vol="70" l="46" r="44" pk="60" mute="1" badge="→ Drums" no-pan="1" fh="150" w="92" layout="row" show-fx="0" hint-size="92px,330px"></dc-import>
<i class="vr" style="margin: 0 2px"></i>
<dc-import name="Strip" label="Master" num="M" color="white" vol="80" l="74" r="71" pk="86" badge="pinned" no-pan="1" no-ms="1" fh="200" w="100" show-fx="0" hint-size="100px,330px"></dc-import>
<div class="plate c f1" style="min-width: 0; padding: 6px; height: 348px; gap: 4px">
<div class="r jb"><span class="tape s">Bass · inserts</span><span class="sm dim b">4 of 8</span></div>
<div class="r g6 sm b" style="min-height: 22px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f2b33d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 12l6 6 6-6"></path></svg><span class="f1">Ducked by Kick −3 dB</span><div class="gr-m" style="max-width: 44px" aria-label="Gain reduction 3 decibels"><i style="width: 25%"></i></div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="8"><button class="slot-b {{ s.cls }}" aria-label="{{ s.label }}"><span class="n">{{ s.n }}</span><span class="t">{{ s.t }}</span></button></sc-for>
</div>
<div class="r jb">
<dc-import name="Knob" label="Pan" size="sm" value="46" readout="L8" hint-size="64px,86px"></dc-import>
<dc-import name="Knob" label="To Verb" size="sm" value="24" readout="−12 dB" hint-size="72px,86px"></dc-import>
<dc-import name="Knob" label="To Delay" size="sm" value="0" readout="off" hint-size="72px,86px"></dc-import>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":892,"height":412}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (n, t, cls, label) => ({ n: String(n), t: t, cls: cls || '', label: label || (n + ' ' + t) });
    const slots = [
      s(1, 'EQ', ''), s(2, 'Saturator', ''), s(3, 'Comp ← Kick', '', '3 Compressor, sidechain key Kick'), s(4, 'Limiter · off', 'byp', '4 Limiter, bypassed'),
      s(5, '+ Add', 'emp', '5 empty slot'), s(6, '+ Add', 'emp', '6 empty slot'), s(7, '+ Add', 'emp', '7 empty slot'), s(8, '+ Add', 'emp', '8 empty slot')
    ];
    return { slots: slots };
  }
}
</script>
</body>
</html>
