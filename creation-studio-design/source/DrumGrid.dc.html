<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lite · Drum grid</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="synth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap">
<style>body{margin:0;background:#33404a}</style>
</helmet>
<div class="sx ph" style="width: 412px; height: 880px">
<div class="ph-hdr" style="gap: 4px; padding: 0 6px">
<button class="prof" aria-label="Lite profile. Tap to see what Lite includes."><b>LITE</b></button>
<span class="tape s">Forest Roll 07</span>
<span class="f1"></span>
<button class="btn ghost sq" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="btn ghost sq" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9ecee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a5 5 0 0 0 0 10h3"></path></svg></button>
<span class="rev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fd1a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>saved r12</span>
</div>
<div style="flex: none; height: 106px">
<dc-import name="Transport" mode="phone" pos="009:2:03" bpm="146.0" cpu="58" lost="0" playing="1" rec="0" loop="1" hint-size="412px,106px"></dc-import>
</div>
<div class="ph-body c" style="padding: 6px 8px; gap: 6px">
<div class="r jb" style="min-height: 44px">
<div class="r g8"><span class="tape">Drums A</span><span class="sm dim b">1 bar · 16 steps</span></div>
<span class="r g6 sm dim"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b8c2c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M2 9a8 8 0 0 1 4-5M22 15a8 8 0 0 1-4 5"></path></svg>Turn for all lanes</span>
</div>
<div class="seg" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" role="group" aria-label="Lane"><button class="btn" style="padding: 8px 0 0; min-width: 0" aria-pressed="false">Snare</button><button class="btn" style="padding: 8px 0 0; min-width: 0" aria-pressed="false">Clap</button><button class="btn on" style="padding: 8px 0 0; min-width: 0" aria-pressed="true">C.hat</button><button class="btn" style="padding: 8px 0 0; min-width: 0" aria-pressed="false">O.hat</button><button class="btn" style="padding: 8px 0 0; min-width: 0" aria-pressed="false">Crash</button><button class="btn" style="padding: 8px 0 0; min-width: 0" aria-pressed="false">Ride</button></div>
<div class="plate c g6" style="padding: 8px">
<div class="r jb"><span class="lbl">Closed hat · steps 1–16</span><span class="sm dim">tap on/off · hold for velocity</span></div>
<dc-import name="StepRow" pat="x.x.x.x.x.x.xox" cell="44" cols="8" head="5" hint-size="376px,92px"></dc-import>
<div class="r g12"><span class="lbl">Step 6</span><div class="step-b"><button class="btn ghost sq" aria-label="Softer">−</button><span class="v">vel 70</span><button class="btn ghost sq" aria-label="Louder">+</button></div><button class="btn tg" aria-pressed="false">Accent</button></div>
</div>
<div class="c" style="margin: 0 -8px; border-top: 1px solid var(--seam)">
<button class="r g8" style="min-height: 44px; width: 100%; padding: 0 8px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; color: var(--text); font-family: inherit; cursor: pointer; " aria-label="Snare lane, select"><span class="tape s" style="width: 86px; text-align: center">Snare</span><span class="f1"></span><dc-import name="StepRow" pat="....x.......x..." cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></button>
<button class="r g8" style="min-height: 44px; width: 100%; padding: 0 8px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; color: var(--text); font-family: inherit; cursor: pointer; " aria-label="Clap lane, select"><span class="tape s" style="width: 86px; text-align: center">Clap</span><span class="f1"></span><dc-import name="StepRow" pat="....x.......x..o" cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></button>
<button class="r g8" style="min-height: 44px; width: 100%; padding: 0 8px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; color: var(--text); font-family: inherit; cursor: pointer; background: var(--slate-lift); box-shadow: inset 3px 0 0 var(--amber);" aria-label="Closed hat lane, select"><span class="tape s" style="width: 86px; text-align: center">Closed hat</span><span class="f1"></span><dc-import name="StepRow" pat="x.x.x.x.x.x.x.x." cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></button>
<button class="r g8" style="min-height: 44px; width: 100%; padding: 0 8px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; color: var(--text); font-family: inherit; cursor: pointer; " aria-label="Open hat lane, select"><span class="tape s" style="width: 86px; text-align: center">Open hat</span><span class="f1"></span><dc-import name="StepRow" pat="..x...x...x...x." cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></button>
<button class="r g8" style="min-height: 44px; width: 100%; padding: 0 8px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; color: var(--text); font-family: inherit; cursor: pointer; " aria-label="Crash lane, select"><span class="tape s" style="width: 86px; text-align: center">Crash</span><span class="f1"></span><dc-import name="StepRow" pat="a..............." cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></button>
<button class="r g8" style="min-height: 44px; width: 100%; padding: 0 8px; border: 0; border-bottom: 1px solid var(--seam); background: transparent; color: var(--text); font-family: inherit; cursor: pointer; " aria-label="Ride lane, select"><span class="tape s" style="width: 86px; text-align: center">Ride</span><span class="f1"></span><dc-import name="StepRow" pat="................" cell="12" cols="16" head="5" hint-size="183px,16px"></dc-import></button>
</div>
</div>
<div style="flex: none; height: 60px">
<dc-import name="Nav" mode="bottom" profile="lite" active="drums" hint-size="412px,60px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
